# Mesures de maîtrise des risques. Chacune maîtrise au moins un risque
# et est mise en œuvre par au moins une exigence. Champs :
#   id            CTRL-nnn
#   description   mesure retenue
#   risks         liste d'identifiants RISK-nnn
#   requirements  liste d'identifiants d'exigences qui la mettent en œuvre
#
# [[control]]
# id = "CTRL-001"
# description = "…"
# risks = ["RISK-001"]
# requirements = ["SW-REQ-001"]

[[control]]
id = "CTRL-001"
description = "Supervision indépendante du volume délivré par un canal de sécurité distinct du canal de commande (processeur, horloge et capteur de position du piston propres), qui coupe le moteur par une autorisation dynamique et place la pompe en état sûr en cas d'écart ou de vitesse hors borne"
risks = ["RISK-001", "RISK-012"]
requirements = ["SYS-REQ-001", "SYS-REQ-002", "SYS-REQ-045", "SYS-REQ-046"]

[[control]]
id = "CTRL-002"
description = "Asservissement du débit fondé sur la position du pousseur et la section du modèle de seringue identifié, avec précision de débit vérifiée sur banc pour chaque seringue"
risks = ["RISK-001", "RISK-002"]
requirements = ["SYS-REQ-003"]

[[control]]
id = "CTRL-003"
description = "Détection d'un actionneur qui ne délivre pas alors qu'une perfusion est en cours"
risks = ["RISK-002"]
requirements = ["SYS-REQ-004"]

[[control]]
id = "CTRL-004"
description = "Contre l'écoulement libre et le siphonage : seringue en place, retenue mécanique du piston par le pousseur, fixation de la seringue dans le berceau et vis d'entraînement irréversible ; piston libéré ou seringue retirée, valve anti-siphon sur le prolongateur, seul type admis dans la liste des consommables vérifiés ; demande de clampage du prolongateur avant la libération du piston, en complément"
risks = ["RISK-003"]
requirements = ["SYS-REQ-005"]

[[control]]
id = "CTRL-005"
description = "Détection de la seringue absente ou mal positionnée et du piston non capturé, avec refus du démarrage ou arrêt et alarme"
risks = ["RISK-002", "RISK-003"]
requirements = ["SYS-REQ-006"]

[[control]]
id = "CTRL-006"
description = "Détection d'air sur le prolongateur, unitaire et cumulée, avec arrêt et alarme"
risks = ["RISK-004"]
requirements = ["SYS-REQ-007"]

[[control]]
id = "CTRL-007"
description = "Détection d'occlusion aval par la force sur le pousseur, avec seuils et délais établis pour chaque modèle de seringue"
risks = ["RISK-005"]
requirements = ["SYS-REQ-008"]

[[control]]
id = "CTRL-008"
description = "Recul du pousseur d'une course calculée pour le modèle de seringue à la détection d'une occlusion, pour limiter le bolus à sa levée"
risks = ["RISK-006"]
requirements = ["SYS-REQ-009"]

[[control]]
id = "CTRL-009"
description = "Saisie protégée : filtrage des rebonds de touche, format numérique sans ambiguïté, récapitulatif à confirmer explicitement"
risks = ["RISK-007"]
requirements = ["SYS-REQ-010", "SYS-REQ-011"]

[[control]]
id = "CTRL-010"
description = "Bibliothèque de médicaments avec limites dures bloquantes et limites souples à confirmer"
risks = ["RISK-007", "RISK-008", "RISK-009"]
requirements = ["SYS-REQ-012"]

[[control]]
id = "CTRL-011"
description = "Affichage de l'unité avec chaque valeur, et du médicament et de la concentration pendant toute la perfusion"
risks = ["RISK-008"]
requirements = ["SYS-REQ-013"]

[[control]]
id = "CTRL-012"
description = "Bolus et purge distincts, bornés chacun par leurs propres limites de volume et de débit ; purge refusée une fois la perfusion démarrée ; purge subordonnée à la condition « ligne non raccordée au patient », refusée si cette condition n'est pas établie et arrêtée si sa violation est détectée ou signalée"
risks = ["RISK-009"]
requirements = ["SYS-REQ-014", "SYS-REQ-028"]

[[control]]
id = "CTRL-013"
description = "Batterie avec bascule secteur/batterie sans interruption, alarmes d'autonomie faible et épuisée, alarme de perte d'alimentation"
risks = ["RISK-010"]
requirements = ["SYS-REQ-015", "SYS-REQ-016"]

[[control]]
id = "CTRL-014"
description = "Chien de garde indépendant et autotests du processeur et des mémoires, avec état sûr en cas d'échec"
risks = ["RISK-001", "RISK-012"]
requirements = ["SYS-REQ-017"]

[[control]]
id = "CTRL-015"
description = "Journal d'événements à écriture confirmée sur support durable, avec détection d'altération et de retour arrière"
risks = ["RISK-011"]
requirements = ["SYS-REQ-018", "SYS-REQ-019"]

[[control]]
id = "CTRL-016"
description = "Alarme technique de repli par un circuit autonome sur réserve propre, armé par le canal de sécurité pendant la perfusion et déclenché par la perte de son signal de vie, sans processeur alimenté ; testée à chaque démarrage"
risks = ["RISK-010", "RISK-012", "RISK-014"]
requirements = ["SYS-REQ-020", "SYS-REQ-046"]

[[control]]
id = "CTRL-017"
description = "Catalogue d'alarmes avec priorités et signaux distinctifs, conditions confirmées avant déclenchement et taux de fausses alarmes mesuré"
risks = ["RISK-013", "RISK-014"]
requirements = ["SYS-REQ-021", "SYS-REQ-022"]

[[control]]
id = "CTRL-018"
description = "Verrouillage de l'interface et authentification des fonctions protégées par rôle"
risks = ["RISK-015", "RISK-019"]
requirements = ["SYS-REQ-023"]

[[control]]
id = "CTRL-019"
description = "Identification visible de la pompe et de la perfusion en cours, lisible à distance"
risks = ["RISK-016"]
requirements = ["SYS-REQ-024"]

[[control]]
id = "CTRL-020"
description = "Conception électrique selon l'IEC 60601-1 : isolement, courants de fuite, alimentation"
risks = ["RISK-017"]
requirements = ["HW-REQ-001"]

[[control]]
id = "CTRL-021"
description = "Boîtier protégé contre la pénétration des liquides et compatible avec les produits de nettoyage"
risks = ["RISK-018"]
requirements = ["HW-REQ-002"]

[[control]]
id = "CTRL-022"
description = "Contrôle d'intégrité et d'origine de la bibliothèque de médicaments et du logiciel avant leur utilisation"
risks = ["RISK-019", "RISK-020"]
requirements = ["SYS-REQ-025", "SYS-REQ-026"]

[[control]]
id = "CTRL-023"
description = "Avertissement de prototype non utilisable sur un patient, sur l'appareil, à son démarrage et dans chaque version publiée"
risks = ["RISK-021"]
requirements = ["SYS-REQ-027"]

[[control]]
id = "CTRL-024"
description = "Vitesse maximale du pousseur bornée par la conception mécanique et électronique, indépendamment du logiciel, pour limiter le volume délivré lors d'un emballement avant l'état sûr"
risks = ["RISK-001", "RISK-012"]
requirements = ["SYS-REQ-043"]

[[control]]
id = "CTRL-025"
description = "Programmation confirmée figée dans le canal de sécurité, qui lit lui-même les touches Démarrer, Confirmer et Arrêt : confirmation, reprise et bolus admis seulement sur un appui qu'il observe, et seuls changements de mode listés"
risks = ["RISK-001", "RISK-012"]
requirements = ["SYS-REQ-044", "SW-REQ-013"]

[[control]]
id = "CTRL-026"
description = "Identification du modèle de seringue : choix dans une liste vérifiée, contrôlé par la mesure du diamètre du corps ; désaccord bloquant"
risks = ["RISK-001", "RISK-002"]
requirements = ["SYS-REQ-047"]

[[control]]
id = "CTRL-027"
description = "Rattrapage des jeux mécaniques avant le démarrage, avec délai au premier écoulement borné et mesuré pour chaque seringue"
risks = ["RISK-002"]
requirements = ["SYS-REQ-048"]
