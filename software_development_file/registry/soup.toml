# Composants logiciels tiers (SOUP, IEC 62304 §5.3.3, §5.3.4, §7.1.2, §8.1.2).
# Description détaillée : software_development_file/soup.md. Champs :
#   id               SOUP-nnn
#   name             nom du composant
#   version          version exacte épinglée (pas d'intervalle, ni « latest », ni branche)
#   supplier         fournisseur ou projet amont
#   license          licence, en expression SPDX
#   purl             facultatif : identifiant Package URL, repris dans la SBOM
#   usage            rôle dans le logiciel
#   requirements     exigences de fonctionnement et de performance demandées au composant
#   known_anomalies  anomalies connues pertinentes et date de leur dernière revue
#
# [[soup]]
# id = "SOUP-001"
# name = "…"
# version = "1.2.3"
# supplier = "…"
# license = "MIT"
# usage = "…"
# requirements = ["SW-REQ-001"]
# known_anomalies = "Revue du 2026-10-09 : …"

[[soup]]
id = "SOUP-001"
name = "mddlog"
version = "0.3.0"
supplier = "Projet mddlog (Ambroise Leclerc), https://github.com/ambroise-leclerc/mddlog"
license = "EUPL-1.2"
purl = "pkg:github/ambroise-leclerc/mddlog@073761b7a6d5ed29ed87bc37c85967db72386d3c"
usage = "Événements d'audit (modèle, anneau borné, persistance chaînée, vérification) et cœur de diagnostic sans allocation, sur le processeur de commande ; adaptateurs de diagnostic sur hôte seulement (ADR 0005). Retenu sous conditions : portage sur la cible, évaluation complète (#135). Cœur d'audit (AuditEvent, AuditRing) dans le code embarqué src/audit, sur l'hôte pour l'instant (#136). Intégré au simulateur, sur l'hôte : cœur de diagnostic (GovernedBinding, RingLog) pour le journal de clepsydre-sim (#44) ; transmission et persistance de l'audit (AuditSinkAdapter, PersistingAuditSink, LogVerifier) pour son journal d'audit (#136)."
requirements = ["SYS-REQ-018", "SYS-REQ-019", "SYS-REQ-034", "SYS-REQ-052", "SW-REQ-008", "SW-REQ-009", "SW-REQ-019"]
known_anomalies = "Revue du 2026-10-16 : aucune anomalie étiquetée bug ouverte ; avec Clang et libstdc++, les adaptateurs (SinkRegistry) ne compilent pas sous -Werror (std::atomic_load_explicit sur shared_ptr, déprécié, avertissement masqué pour GCC et MSVC seulement), avertissement toléré pour la seule cible mddlog avec Clang, SinkRegistry non employé, signalé en amont (mddlog #150) ; le modèle d'événement ne porte ni le temps monotone ni l'heure douteuse que prévoit son ADR-002 (mddlog #154, #155), placés dans le détail ; l'AuditService que cite l'ADR 0005 n'existe pas dans 0.3.0 ; mddlog #147 ouverte (signalement ThreadSanitizer promise/future avec libc++ 21 sur le SimpleLogger historique, non qualifié, chemin non retenu sur la cible) ; version antérieure à 1.0, API et formats non figés (#121) ; aucune cible embarquée testée ; aucun fournisseur d'ancrage indépendant réel livré."
