# Exigences système (SYS-REQ-nnn), logicielles (SW-REQ-nnn) et matérielles (HW-REQ-nnn).
# Spécification : docs/requirements/requirements-specification.md (#10). Champs :
#   id      identifiant unique
#   title   intitulé court
#   text    énoncé vérifiable, formulé avec « doit »
#   source  besoin utilisateur, risque, norme ou usage prévu d'origine
#   status  draft | approved | obsolete ; une exigence approved doit être vérifiée
#
# [[requirement]]
# id = "SW-REQ-001"
# title = "…"
# text = "Le logiciel doit …"
# source = "docs/intended-use.md, H-02"
# status = "draft"

[[requirement]]
id = "SYS-REQ-001"
title = "Supervision indépendante du volume délivré"
text = "Un canal de sécurité indépendant du canal de commande doit mesurer le volume délivré par la position du piston, au moyen d'un capteur qui lui est propre, et placer la pompe en état sûr lorsque l'écart au volume attendu dépasse le plus grand de 10 % du volume attendu et 0,5 mL, ou lorsque la vitesse du piston dépasse la borne du mode actif sur une fenêtre de 2 s."
source = "Mesure CTRL-001 (RISK-001, RISK-012) ; ADR 0003"
status = "draft"

[[requirement]]
id = "SYS-REQ-002"
title = "État sûr"
text = "Sur détection d'une condition dangereuse, la pompe doit, en 1 s au plus, arrêter l'actionneur, maintenir le dispositif anti-écoulement libre actif et déclencher une alarme de priorité haute."
source = "Mesure CTRL-001 (RISK-001, RISK-012)"
status = "draft"

[[requirement]]
id = "SYS-REQ-003"
title = "Précision de débit"
text = "La pompe doit délivrer le débit programmé avec une erreur de ± 5 % au plus en régime établi, aux débits d'essai de l'IEC 60601-2-24, mesurée selon la méthode de cette norme (courbes en trompette publiées)."
source = "Mesure CTRL-002 (RISK-001, RISK-002) ; usage prévu H-04 ; IEC 60601-2-24"
status = "draft"

[[requirement]]
id = "SYS-REQ-004"
title = "Actionneur inactif"
text = "La pompe doit détecter qu'un actionneur ne délivre pas alors qu'une perfusion est en cours, au plus tard 60 s après le temps nécessaire pour délivrer 0,05 mL au débit programmé, et déclencher une alarme de priorité haute."
source = "Mesure CTRL-003 (RISK-002)"
status = "draft"

[[requirement]]
id = "SYS-REQ-005"
title = "Anti-écoulement libre"
text = "Aucun écoulement libre ne doit être possible, ni par siphonage. Seringue en place, le piston doit être retenu par le pousseur, la seringue fixée dans le berceau, et la vis d'entraînement ne doit pas pouvoir être entraînée par le piston. Lorsque le piston est libéré ou la seringue retirée, ces protections n'agissant plus, l'écoulement libre doit être empêché par une valve anti-siphon du prolongateur : la liste des consommables vérifiés n'admet que des prolongateurs qui en sont munis. Avant de libérer le piston, la pompe doit en outre demander de clamper le prolongateur."
source = "Mesure CTRL-004 (RISK-003) ; UN-04 ; IEC 60601-2-24 ; ADR 0002, ADR 0003"
status = "draft"

[[requirement]]
id = "SYS-REQ-006"
title = "Seringue et piston"
text = "La pompe doit refuser de démarrer, ou arrêter la perfusion et déclencher une alarme de priorité haute, si la seringue est absente ou mal positionnée dans le berceau, ou si le piston n'est pas capturé par le pousseur."
source = "Mesure CTRL-005 (RISK-002, RISK-003) ; UN-04"
status = "draft"

[[requirement]]
id = "SYS-REQ-007"
title = "Air dans la ligne"
text = "La pompe doit détecter sur le prolongateur, en aval de la seringue, une bulle d'air unitaire d'au moins 50 µL et un volume d'air cumulé d'au moins 1 mL sur 15 min, puis placer la pompe en état sûr. Ces seuils ne peuvent être configurés qu'à la baisse."
source = "Mesure CTRL-006 (RISK-004) ; UN-06 ; IEC 60601-2-24"
status = "draft"

[[requirement]]
id = "SYS-REQ-008"
title = "Délai d'alarme d'occlusion"
text = "Au seuil par défaut, la pompe doit déclencher l'alarme d'occlusion aval, détectée par la force sur le pousseur, en 30 min au plus à 1 mL/h et en 2 min au plus à 25 mL/h, pour chaque modèle de seringue de la liste vérifiée ; délais mesurés selon l'IEC 60601-2-24 et publiés avec le seuil, par modèle de seringue."
source = "Mesure CTRL-007 (RISK-005) ; UN-06 ; IEC 60601-2-24"
status = "draft"

[[requirement]]
id = "SYS-REQ-009"
title = "Bolus post-occlusion"
text = "À la détection d'une occlusion aval, la pompe doit faire reculer le pousseur d'une course calculée pour le modèle de seringue ; le volume libéré à la levée de l'occlusion, mesuré selon l'IEC 60601-2-24 au seuil le plus élevé, doit rester inférieur à 0,2 mL pour chaque modèle de la liste vérifiée."
source = "Mesure CTRL-008 (RISK-006) ; UN-09 ; IEC 60601-2-24"
status = "draft"

[[requirement]]
id = "SYS-REQ-010"
title = "Rebond de touche"
text = "Un appui sur une touche ne doit produire qu'une seule saisie, quels que soient les rebonds du contact."
source = "Mesure CTRL-009 (RISK-007) ; UN-03"
status = "draft"

[[requirement]]
id = "SYS-REQ-011"
title = "Récapitulatif et confirmation"
text = "Avant le démarrage, la pompe doit afficher un récapitulatif (médicament, concentration, débit, volume, durée) et exiger une confirmation explicite distincte de la saisie."
source = "Mesure CTRL-009 (RISK-007) ; UN-01"
status = "draft"

[[requirement]]
id = "SYS-REQ-012"
title = "Limites de dose"
text = "La pompe doit refuser toute programmation hors des limites dures du médicament et exiger une confirmation spécifique au-delà des limites souples."
source = "Mesure CTRL-010 (RISK-007, RISK-008, RISK-009) ; UN-03"
status = "draft"

[[requirement]]
id = "SYS-REQ-013"
title = "Affichage des unités"
text = "Chaque valeur affichée doit être accompagnée de son unité ; le médicament, la concentration et le débit doivent rester affichés pendant la perfusion."
source = "Mesure CTRL-011 (RISK-008) ; UN-02"
status = "draft"

[[requirement]]
id = "SYS-REQ-014"
title = "Bolus et purge bornés"
text = "Le bolus et la purge doivent être des commandes distinctes. Le volume et le débit d'un bolus doivent être bornés par les limites configurées pour le médicament ; ceux d'une purge, par des limites propres à la purge, qui ne peuvent servir à administrer un bolus. La purge doit être refusée une fois la perfusion démarrée."
source = "Mesure CTRL-012 (RISK-009) ; UN-03, UN-05"
status = "draft"

[[requirement]]
id = "SYS-REQ-015"
title = "Bascule d'alimentation"
text = "La perte de l'alimentation secteur ne doit pas interrompre ni modifier la perfusion en cours tant que la batterie n'est pas épuisée. La bascule entre le secteur et la batterie doit être assurée par le matériel, sans intervention logicielle ; elle ne doit réinitialiser aucun processeur ni arrêter le pousseur en mouvement, et doit être signalée et journalisée."
source = "Mesure CTRL-013 (RISK-010) ; UN-11 ; ADR 0004"
status = "draft"

[[requirement]]
id = "SYS-REQ-016"
title = "Alarmes d'alimentation"
text = "La pompe doit déclencher une alarme d'autonomie faible lorsque l'autonomie estimée selon SYS-REQ-049 atteint 30 min, puis une alarme de priorité haute d'autonomie épuisée lorsqu'elle atteint 5 min ; la perfusion se poursuit pendant ce préavis. L'arrêt doit intervenir à l'épuisement, atteint lorsque l'autonomie estimée est nulle ou lorsque la tension de la batterie franchit un seuil d'arrêt indépendant de la jauge, placé au-dessus du seuil de coupure du circuit de protection. Si ce seuil de tension est franchi avant la fin du préavis, l'arrêt doit intervenir sans attendre, précédé de l'alarme haute si elle n'était pas déjà déclenchée. L'arrêt doit être commandé : état sûr, journalisation de l'arrêt, puis mise hors tension. Avec une jauge conforme à SYS-REQ-049, les deux alarmes doivent précéder l'arrêt d'au moins 30 min et 5 min."
source = "Mesure CTRL-013 (RISK-010) ; UN-11 ; IEC 60601-2-24 ; ADR 0004"
status = "draft"

[[requirement]]
id = "SYS-REQ-049"
title = "Estimation de l'autonomie"
text = "L'autonomie restante affichée et celle qui déclenche les alarmes de SYS-REQ-016 doivent être estimées par comptage coulométrique, recalé à pleine charge, à partir de la capacité restante minorée de l'incertitude de la jauge et de la consommation majorée ; elles ne doivent jamais dépasser l'autonomie réelle. La capacité mesurée à chaque recalage doit être journalisée, et une batterie dont la capacité est inférieure à 80 % de sa capacité nominale doit être signalée en maintenance."
source = "Mesure CTRL-013 (RISK-010, RISK-013) ; UN-11 ; ADR 0004"
status = "draft"

[[requirement]]
id = "SYS-REQ-050"
title = "Coupure imminente et réserve de maintien"
text = "Un superviseur de tension matériel doit signaler à chaque processeur la perte simultanée du secteur et de la batterie avant que la tension ne descende sous leur seuil de fonctionnement. Une réserve de maintien doit alors permettre de retirer l'autorisation moteur, de refuser toute nouvelle écriture, d'achever l'écriture en cours la plus longue du journal ou de l'état de perfusion avec une marge d'un facteur 2, puis de journaliser la coupure si la réserve le permet. L'intégrité des données persistantes ne doit pas dépendre de cette réserve (SW-REQ-017)."
source = "Mesure CTRL-015 (RISK-011) ; ADR 0004"
status = "draft"

[[requirement]]
id = "SYS-REQ-017"
title = "Surveillance du processeur"
text = "Un chien de garde indépendant et des autotests du processeur et des mémoires doivent placer la pompe en état sûr en cas de défaillance détectée."
source = "Mesure CTRL-014 (RISK-001, RISK-012)"
status = "draft"

[[requirement]]
id = "SYS-REQ-018"
title = "Persistance du journal"
text = "Un événement de sécurité ne doit être considéré comme enregistré qu'après son écriture confirmée sur un support durable."
source = "Mesure CTRL-015 (RISK-011) ; UN-16"
status = "draft"

[[requirement]]
id = "SYS-REQ-019"
title = "Intégrité du journal"
text = "Toute altération, suppression ou retour arrière du journal d'événements doit être détectable lors de sa vérification, sur l'appareil ou hors de l'appareil."
source = "Mesure CTRL-015 (RISK-011) ; UN-16"
status = "draft"

[[requirement]]
id = "SYS-REQ-052"
title = "Témoin d'ancrage du journal"
text = "Le canal de sécurité doit être le témoin d'ancrage du journal d'audit : il doit recevoir chaque événement dans son encodage canonique, recalculer lui-même le chaînage de chaque flux à partir de son propre dernier condensat, et ne faire avancer l'ancrage que d'un événement à la fois, dans l'ordre des séquences ; un trou, un doublon de contenu différent ou une séquence décroissante doit être refusé et signalé. Il ne doit accepter le retrait d'un préfixe que pour la rotation du journal, sous la position ancrée et au-delà de la durée de rétention minimale, en conservant le condensat du préfixe retiré. À chaque démarrage et au moins une fois par heure, la chaîne du témoin doit être comparée à celle du support ; tout désaccord doit déclencher une alarme technique."
source = "Mesure CTRL-015 (RISK-011) ; UN-16 ; ADR 0005"
status = "draft"

[[requirement]]
id = "SYS-REQ-020"
title = "Alarme de repli"
text = "Pendant une perfusion, une alarme technique sonore doit retentir même si le processeur de commande ou le processeur de sécurité est défaillant, ou si aucun processeur n'est alimenté. Elle repose sur un circuit autonome, alimenté par une pile lithium primaire qui lui est propre, armé par le canal de sécurité au démarrage de la perfusion et déclenché par la perte de son signal de vie ; elle doit retentir au moins 2 min sur cette pile, qui est remplacée en maintenance."
source = "Mesure CTRL-016 (RISK-010, RISK-012, RISK-014) ; ADR 0003, ADR 0004"
status = "draft"

[[requirement]]
id = "SYS-REQ-021"
title = "Priorités et signaux d'alarme"
text = "Chaque condition d'alarme doit avoir la priorité fixée par le catalogue des alarmes de ce document et être signalée par les signaux visuels et sonores de cette priorité selon l'IEC 60601-1-8 ; une alarme de priorité supérieure ne doit jamais être masquée par une alarme de priorité inférieure."
source = "Mesure CTRL-017 (RISK-013, RISK-014) ; UN-06, UN-07 ; IEC 60601-1-8"
status = "draft"

[[requirement]]
id = "SYS-REQ-022"
title = "Fausses alarmes"
text = "Le taux d'alarmes interrompant à tort la perfusion doit rester inférieur à 1 pour 100 h de perfusion, mesuré sur banc et pendant l'évaluation formative."
source = "Mesure CTRL-017 (RISK-013, RISK-014)"
status = "draft"

[[requirement]]
id = "SYS-REQ-023"
title = "Verrouillage et rôles"
text = "La pompe doit permettre de verrouiller l'interface pendant une perfusion et réserver les fonctions de configuration et de maintenance aux utilisateurs authentifiés selon leur rôle."
source = "Mesure CTRL-018 (RISK-015, RISK-019) ; UN-12, UN-14"
status = "draft"

[[requirement]]
id = "SYS-REQ-024"
title = "Identification à distance"
text = "Pendant une perfusion, l'état de la pompe, le médicament et le débit doivent être lisibles à 3 m sous l'éclairage d'une chambre d'hospitalisation."
source = "Mesure CTRL-019 (RISK-016) ; UN-02"
status = "draft"

[[requirement]]
id = "SYS-REQ-025"
title = "Intégrité de la bibliothèque"
text = "La pompe doit vérifier l'intégrité et l'origine de la bibliothèque de médicaments avant de l'utiliser et afficher sa version."
source = "Mesure CTRL-022 (RISK-019, RISK-020) ; UN-14"
status = "draft"

[[requirement]]
id = "SYS-REQ-026"
title = "Intégrité du logiciel"
text = "La pompe ne doit exécuter qu'un logiciel dont l'intégrité et l'origine ont été vérifiées, et une mise à jour interrompue ne doit pas laisser la pompe dans un état utilisable non vérifié."
source = "Mesure CTRL-022 (RISK-019, RISK-020)"
status = "draft"

[[requirement]]
id = "SYS-REQ-027"
title = "Avertissement de prototype"
text = "L'appareil doit porter l'avertissement « PROTOTYPE — NE PAS UTILISER SUR UN PATIENT » et l'afficher au démarrage jusqu'à acquittement explicite."
source = "Mesure CTRL-023 (RISK-021) ; usage prévu, avertissement"
status = "draft"

[[requirement]]
id = "SYS-REQ-028"
title = "Purge sur ligne non raccordée"
text = "Une purge ne doit être lancée que si la condition « ligne non raccordée au patient » a été établie immédiatement avant son lancement, y compris avant le premier démarrage d'une perfusion ; à défaut, la purge doit être refusée. Si la violation de cette condition est détectée ou signalée pendant la purge, celle-ci doit s'arrêter immédiatement, et l'utilisateur doit pouvoir l'arrêter à tout moment. Le moyen d'établir et de surveiller cette condition sera choisi avec l'architecture (#13, #14)."
source = "Mesure CTRL-012 (RISK-009) ; UN-05 ; scénario S2"
status = "draft"

[[requirement]]
id = "SYS-REQ-029"
title = "Modes de perfusion"
text = "La pompe doit offrir trois modes : débit continu, volume à perfuser sur une durée programmée, et bolus à la demande du soignant pendant une perfusion en débit continu ; un seul canal de perfusion est géré par appareil."
source = "UN-01 ; usage prévu H-01, H-06"
status = "draft"

[[requirement]]
id = "SYS-REQ-030"
title = "Plage et résolution du débit"
text = "Le débit programmable doit couvrir 0,1 à 200 mL/h avec une résolution de 0,1 mL/h, dans la limite du débit maximal du modèle de seringue installé ; toute valeur hors de cette plage doit être refusée."
source = "UN-01 ; usage prévu H-02, H-03 ; ADR 0002"
status = "draft"

[[requirement]]
id = "SYS-REQ-031"
title = "Volume à perfuser"
text = "Le volume à perfuser doit être programmable de 0,1 mL au volume utile de la seringue installée, avec une résolution de 0,1 mL ; le volume perfusé et le volume restant doivent être affichés pendant la perfusion."
source = "UN-01, UN-02 ; usage prévu H-05 ; ADR 0002"
status = "draft"

[[requirement]]
id = "SYS-REQ-032"
title = "Fin de perfusion"
text = "La pompe doit déclencher une préalarme de fin de perfusion un délai configurable avant la fin (1 à 30 min, 5 min par défaut). À l'atteinte du volume à perfuser, elle doit déclencher l'alarme de fin de perfusion et, selon la bibliothèque, s'arrêter ou poursuivre à un débit de maintien de veine ouverte qui ne peut dépasser ni le débit programmé ni 5 mL/h. La position du piston doit en outre déclencher la préalarme de seringue presque vide, au même délai, et l'alarme de seringue vide, qui arrête la perfusion."
source = "UN-10 ; scénario S6 ; IEC 60601-2-24 ; ADR 0002"
status = "draft"

[[requirement]]
id = "SYS-REQ-033"
title = "Autonomie"
text = "Avec une batterie neuve chargée, la pompe doit perfuser au moins 4 h à 25 mL/h sur batterie, et afficher l'autonomie restante estimée."
source = "UN-11 ; usage prévu H-07"
status = "draft"

[[requirement]]
id = "SYS-REQ-034"
title = "Contenu du journal"
text = "La pompe doit journaliser chaque programmation et modification, démarrage, arrêt, bolus, purge, alarme (déclenchement, pause, acquittement, fin), changement d'alimentation, défaillance détectée et modification de configuration, avec sa date, son auteur ou son rôle lorsqu'il est connu, et conserver au moins les 10 000 derniers événements, y compris sans alimentation."
source = "UN-14, UN-16 ; RISK-011 ; ADR 0005"
status = "draft"

[[requirement]]
id = "SYS-REQ-035"
title = "Datation"
text = "Chaque événement doit porter une date en UTC avec une résolution de 1 s, un numéro d'ordre strictement croissant dans son flux et le temps monotone écoulé depuis le démarrage ; l'horloge doit dériver de moins de 1 min par mois. L'heure ne doit être réglée que par un technicien authentifié, sans synchronisation par réseau, et chaque mise à l'heure doit être journalisée avec l'ancienne et la nouvelle heure."
source = "Mesure CTRL-030 (RISK-011) ; UN-16 ; ADR 0006"
status = "draft"

[[requirement]]
id = "SYS-REQ-054"
title = "Heure indisponible ou douteuse"
text = "Si l'heure civile est indisponible (oscillateur arrêté, réserve épuisée, horloge illisible), les événements doivent porter l'indication « heure indisponible », jamais une heure estimée. Toutes les 10 s, l'avance de l'heure civile doit être comparée à celle du temps monotone : un écart de plus de 2 s, ou une heure antérieure au dernier événement journalisé, doit être journalisé comme saut, et les événements suivants doivent porter l'indication « heure douteuse » jusqu'à la prochaine mise à l'heure. Une heure indisponible ou douteuse doit déclencher un signal d'information et une demande de mise à l'heure, sans interrompre ni modifier la perfusion."
source = "Mesure CTRL-030 (RISK-011) ; RISK-013 ; UN-16 ; ADR 0006"
status = "draft"

[[requirement]]
id = "SYS-REQ-036"
title = "Pause du signal sonore"
text = "Le soignant doit pouvoir suspendre le signal sonore d'une alarme pour 2 min au plus ; la condition reste surveillée et affichée, et le signal reprend à l'échéance si elle persiste ou dès qu'une condition de priorité supérieure apparaît."
source = "UN-08 ; RISK-014 ; IEC 60601-1-8"
status = "draft"

[[requirement]]
id = "SYS-REQ-037"
title = "Consultation de l'historique"
text = "La pompe doit permettre de consulter sur l'appareil, sans authentification, les programmations, alarmes et actions des 24 dernières heures, datées."
source = "UN-13, UN-16"
status = "draft"

[[requirement]]
id = "SYS-REQ-038"
title = "Reprise après réinitialisation"
text = "Après une réinitialisation ou une coupure totale d'alimentation survenue pendant une perfusion, la pompe ne doit pas reprendre la perfusion d'elle-même : elle doit déclencher une alarme de priorité haute. Si l'état de perfusion enregistré est intègre, elle doit proposer la perfusion interrompue avec son débit, son volume à perfuser, le volume déjà délivré et le volume restant ; la confirmation par le soignant ne doit relancer que le volume restant, jamais le volume initial entier. Le volume délivré enregistré est la borne réservée de SYS-REQ-051, et le volume restant proposé est le volume à perfuser diminué de cette borne. Aucune reprise ne doit être proposée si le volume correspondant au déplacement du piston mesuré par le canal de sécurité, majoré de l'incertitude de mesure établie pour ce capteur, dépasse la borne, si la position de départ enregistrée manque, ou si la seringue a pu être déplacée : la borne n'est alors plus une majoration démontrée du volume délivré. Si l'état enregistré est absent ou corrompu, aucune reprise ne doit être proposée : la pompe doit indiquer que le volume déjà délivré est inconnu et exiger une nouvelle programmation complète."
source = "Mesure CTRL-029 (RISK-001, RISK-012) ; RISK-010 ; UN-11 ; ADR 0004"
status = "draft"

[[requirement]]
id = "SYS-REQ-051"
title = "Réservation du volume avant délivrance"
text = "Avant d'autoriser la délivrance d'un incrément de volume d'au plus 0,1 mL, le processeur de commande doit écrire durablement la borne réservée, égale au volume délivré augmenté de cet incrément, dans une mémoire non volatile dont l'endurance supporte une réservation par incrément au débit maximal pendant toute la durée de vie de la pompe. La consigne de l'actionneur ne doit jamais faire dépasser la borne réservée : faute de nouvelle réservation confirmée, le pousseur doit s'arrêter à la borne, et l'échec d'une réservation doit placer la pompe en état sûr."
source = "Mesure CTRL-029 (RISK-001, RISK-012) ; SYS-REQ-038 ; ADR 0004"
status = "draft"

[[requirement]]
id = "SYS-REQ-039"
title = "Langue de l'interface"
text = "Tous les textes de l'interface et des messages d'alarme doivent être disponibles en français."
source = "Usage prévu H-09"
status = "draft"

[[requirement]]
id = "SYS-REQ-040"
title = "Fonctionnement sans réseau"
text = "La pompe doit pouvoir perfuser sans aucune connexion réseau, et aucune interface de communication ne doit permettre de modifier une perfusion en cours."
source = "Usage prévu H-08 ; RISK-015"
status = "draft"

[[requirement]]
id = "SYS-REQ-041"
title = "Contrôle et mise hors service"
text = "Un technicien authentifié doit pouvoir exécuter un contrôle de fonctionnement (capteurs, signaux d'alarme, précision) et mettre la pompe hors service ; une pompe hors service doit refuser toute perfusion jusqu'à sa remise en service, journalisée."
source = "UN-15 ; scénario S7"
status = "draft"

[[requirement]]
id = "SYS-REQ-042"
title = "Rappel de pompe inactive"
text = "Une pompe programmée mais non démarrée, ou en pause, depuis 2 min doit déclencher une alarme de rappel de priorité moyenne, jusqu'au démarrage, à la reprise ou à l'annulation de la programmation."
source = "RISK-002, RISK-014 ; UN-06"
status = "draft"

[[requirement]]
id = "SYS-REQ-043"
title = "Vitesse maximale bornée par conception"
text = "La vitesse maximale du pousseur doit être bornée par la conception mécanique et électronique, indépendamment du logiciel, de sorte que le volume délivré entre le début d'un emballement et l'état sûr reste inférieur à 0,5 mL avec la plus grande seringue de la liste vérifiée."
source = "Mesure CTRL-024 (RISK-001, RISK-012) ; ADR 0003"
status = "draft"

[[requirement]]
id = "SYS-REQ-044"
title = "Programmation verrouillée par le canal de sécurité"
text = "Le canal de sécurité doit surveiller la programmation qu'il a renvoyée pour affichage au récapitulatif et que le soignant a confirmée. Il doit lire lui-même les touches Démarrer, Confirmer et Arrêt, et n'accepter une programmation que sur un appui sur Confirmer qu'il observe dans les 30 s suivant le renvoi de la copie. Il doit refuser toute nouvelle programmation tant qu'il autorise le moteur. Pendant une perfusion, il ne doit admettre que : la pause et l'arrêt, à tout moment ; la reprise, sur un appui sur Démarrer qu'il observe ; le bolus, sur un appui sur Confirmer qu'il observe, borné par la programmation confirmée ; le passage prévu au maintien de veine ouverte, déclenché par le volume qu'il mesure. Toute autre demande de la commande doit être refusée."
source = "Mesure CTRL-025 (RISK-001, RISK-012) ; ADR 0003"
status = "draft"

[[requirement]]
id = "SYS-REQ-045"
title = "Coupure par autorisation dynamique"
text = "Le pilote moteur ne doit être validé que par la combinaison matérielle d'une autorisation du canal de commande et d'une autorisation dynamique du canal de sécurité ; un processeur bloqué, réinitialisé ou hors tension doit retirer son autorisation, et l'état par défaut de la validation doit être « non validé »."
source = "Mesure CTRL-001 (RISK-001, RISK-012) ; ADR 0003"
status = "draft"

[[requirement]]
id = "SYS-REQ-046"
title = "Tests de la coupure et de l'alarme autonome"
text = "À chaque démarrage, la pompe doit vérifier que chacun des deux canaux peut couper le moteur, que le circuit d'alarme autonome retentit et que la tension en charge de sa pile dépasse son seuil de remplacement ; tout échec doit la mettre hors service."
source = "Mesures CTRL-001, CTRL-016 (RISK-012, RISK-014) ; ADR 0003, ADR 0004"
status = "draft"

[[requirement]]
id = "SYS-REQ-053"
title = "Liaison entre les processeurs"
text = "Les deux processeurs doivent communiquer par une liaison point à point dont chaque trame porte un numéro de transport augmenté de 1 à chaque émission et un CRC-32. Chacun doit émettre un signal de vie toutes les 50 ms. L'absence de trame valide pendant 200 ms, un numéro de transport manquant, répété ou décroissant, ou un changement du numéro de démarrage de l'émetteur doit être traité comme une perte de lien, qui place la pompe en état sûr dans le délai de SYS-REQ-002 ; les messages de sécurité ne doivent pas être retransmis. Un désaccord de version du protocole au démarrage doit mettre la pompe hors service."
source = "Mesure CTRL-031 (RISK-001, RISK-012) ; ADR 0003, ADR 0006"
status = "draft"

[[requirement]]
id = "SYS-REQ-047"
title = "Identification de la seringue"
text = "Le soignant doit choisir le modèle de seringue dans une liste de seringues vérifiées, configurée par un technicien authentifié et protégée comme la bibliothèque de médicaments ; la pompe doit mesurer le diamètre du corps de la seringue et refuser de démarrer s'il ne correspond pas au modèle choisi."
source = "Mesure CTRL-026 (RISK-001, RISK-002) ; ADR 0002"
status = "draft"

[[requirement]]
id = "SYS-REQ-048"
title = "Délai au premier écoulement"
text = "La pompe doit rattraper les jeux mécaniques avant le démarrage d'une perfusion ; le délai entre le démarrage et le premier écoulement doit rester inférieur à 5 min à 1 mL/h pour chaque modèle de seringue de la liste vérifiée, mesuré sur banc et publié."
source = "Mesure CTRL-027 (RISK-002) ; ADR 0002"
status = "draft"

[[requirement]]
id = "SW-REQ-001"
title = "Machine à états"
text = "Le logiciel de commande doit être une machine à états explicite (arrêt, programmation, prête, perfusion, pause, alarme, état sûr, maintenance, hors service) ; toute transition non prévue doit être refusée et journalisée."
source = "SYS-REQ-002, SYS-REQ-029, SYS-REQ-038 ; #24"
status = "draft"

[[requirement]]
id = "SW-REQ-002"
title = "Validation des valeurs programmées"
text = "Le logiciel doit vérifier chaque valeur programmée par rapport aux plages de SYS-REQ-030 et SYS-REQ-031 et aux limites de la bibliothèque avant de l'accepter, et refuser explicitement toute valeur hors limites."
source = "SYS-REQ-012, SYS-REQ-030, SYS-REQ-031"
status = "draft"

[[requirement]]
id = "SW-REQ-003"
title = "Format numérique sans ambiguïté"
text = "Le logiciel doit afficher et saisir les nombres sans zéro final après la virgule et avec un zéro avant la virgule pour les valeurs inférieures à 1 ; une saisie comportant plus d'un séparateur décimal ou plus de décimales que la résolution doit être refusée."
source = "SYS-REQ-010, SYS-REQ-013 ; mesure CTRL-009"
status = "draft"

[[requirement]]
id = "SW-REQ-004"
title = "Filtrage des rebonds"
text = "Le logiciel ne doit valider un changement d'état d'une touche qu'après 20 ms de stabilité, et une touche maintenue ne doit pas répéter une saisie numérique."
source = "SYS-REQ-010"
status = "draft"

[[requirement]]
id = "SW-REQ-005"
title = "Calcul du volume sans dérive"
text = "Le logiciel doit calculer le volume délivré et le volume restant en arithmétique entière ou à virgule fixe, sans erreur d'arrondi cumulée supérieure à 0,01 mL sur toute la perfusion."
source = "SYS-REQ-003, SYS-REQ-031"
status = "draft"

[[requirement]]
id = "SW-REQ-006"
title = "Consigne d'actionneur bornée"
text = "Avant chaque envoi à l'actionneur, le logiciel doit vérifier que la consigne ne dépasse pas la borne du mode actif : en perfusion, le débit programmé ou calculé, puis le débit de maintien de veine ouverte après la fin de perfusion ; en bolus, le débit de bolus autorisé par les limites du médicament ; en purge, le débit autorisé pour la purge. Chaque borne est plafonnée par le débit maximal de la pompe, et seule la borne du mode actif s'applique ; hors de ces modes, toute consigne non nulle est hors bornes. Le mode et sa borne doivent changer ensemble, sans état intermédiaire où une consigne serait vérifiée contre la borne d'un autre mode. Une consigne hors bornes doit placer la pompe en état sûr."
source = "SYS-REQ-001, SYS-REQ-014, SYS-REQ-029, SYS-REQ-030, SYS-REQ-032"
status = "draft"

[[requirement]]
id = "SW-REQ-007"
title = "Catalogue des alarmes"
text = "Le logiciel doit dériver toutes les alarmes d'un catalogue unique donnant, pour chaque condition, sa priorité, son délai de confirmation et l'action associée ; une condition doit être signalée 1 s au plus après son délai de confirmation."
source = "SYS-REQ-021, SYS-REQ-022, SYS-REQ-036 ; #31"
status = "draft"

[[requirement]]
id = "SW-REQ-008"
title = "Enregistrement confirmé"
text = "Le service de journalisation ne doit signaler un événement comme enregistré qu'après confirmation de son écriture durable ; tout refus ou perte d'événement doit être signalé à l'appelant et traité selon une politique définie."
source = "SYS-REQ-018, SYS-REQ-034 ; #45, #46"
status = "draft"

[[requirement]]
id = "SW-REQ-009"
title = "Détection d'altération du journal"
text = "Chaque entrée du journal doit porter un numéro de séquence strictement croissant et un code de détection d'altération couvrant son contenu et l'entrée précédente."
source = "SYS-REQ-019, SYS-REQ-035 ; #47"
status = "draft"

[[requirement]]
id = "SW-REQ-010"
title = "Autotests au démarrage"
text = "Au démarrage, le logiciel doit vérifier l'intégrité de la mémoire programme et des données persistantes, la mémoire vive, l'horloge, les capteurs et les signaux d'alarme ; tout échec doit mettre la pompe hors service avec un message de défaillance."
source = "SYS-REQ-017, SYS-REQ-026"
status = "draft"

[[requirement]]
id = "SW-REQ-011"
title = "Autotests périodiques"
text = "Pendant le fonctionnement, le logiciel doit revérifier l'intégrité de la mémoire programme au moins une fois par heure et la plausibilité des capteurs à chaque cycle de surveillance ; tout échec doit placer la pompe en état sûr."
source = "SYS-REQ-017"
status = "draft"

[[requirement]]
id = "SW-REQ-012"
title = "Service du chien de garde"
text = "Le chien de garde ne doit être rafraîchi qu'après vérification que chaque tâche de commande et de surveillance a terminé son cycle dans le délai prévu, jamais depuis une interruption périodique."
source = "SYS-REQ-017"
status = "draft"

[[requirement]]
id = "SW-REQ-013"
title = "Cohérence commande et supervision"
text = "Le logiciel de commande doit transmettre la programmation au canal de sécurité avant la confirmation, par une interface définie, et afficher au récapitulatif la copie renvoyée par ce canal ; tout désaccord détecté entre les deux canaux doit placer la pompe en état sûr."
source = "SYS-REQ-001, SYS-REQ-002, SYS-REQ-044 ; ADR 0003"
status = "draft"

[[requirement]]
id = "SW-REQ-014"
title = "Chargement de la bibliothèque"
text = "Le logiciel ne doit charger une bibliothèque de médicaments qu'après vérification de sa signature et de son intégrité ; en cas d'échec, il doit conserver la bibliothèque valide précédente et journaliser le refus."
source = "SYS-REQ-025"
status = "draft"

[[requirement]]
id = "SW-REQ-015"
title = "Installation d'une mise à jour"
text = "Le logiciel ne doit installer une mise à jour qu'après vérification de sa signature, et l'installation doit être atomique : une interruption doit laisser la version précédente vérifiée exécutable."
source = "SYS-REQ-026 ; #68"
status = "draft"

[[requirement]]
id = "SW-REQ-016"
title = "Authentification et verrouillage"
text = "Les fonctions de configuration et de maintenance doivent exiger un code propre à chaque rôle ; la session doit se fermer après 2 min d'inactivité et chaque ouverture ou échec d'authentification doit être journalisé."
source = "SYS-REQ-023 ; #39"
status = "draft"

[[requirement]]
id = "SW-REQ-017"
title = "Données persistantes protégées"
text = "Les paramètres, la bibliothèque et l'état de perfusion enregistrés doivent être protégés par un code de détection d'erreur ; des données corrompues ne doivent jamais être utilisées."
source = "SYS-REQ-017, SYS-REQ-025, SYS-REQ-038"
status = "draft"

[[requirement]]
id = "SW-REQ-018"
title = "Temps monotone"
text = "Les délais de sécurité (confirmation d'alarme, pause, détections, signal de vie) doivent être mesurés sur une base de temps monotone, insensible aux mises à l'heure de l'horloge ; chaque processeur doit utiliser son propre compteur matériel, jamais réglé ni partagé avec l'autre processeur."
source = "SYS-REQ-035, SYS-REQ-053 ; #49 ; ADR 0006"
status = "draft"

[[requirement]]
id = "SW-REQ-019"
title = "Séparation de l'audit et du diagnostic"
text = "Le logiciel doit séparer les événements d'audit, au vocabulaire fermé, des journaux de diagnostic : aucune trace de diagnostic ne doit être enregistrée ni acceptée comme événement d'audit, toute perte de traces de diagnostic doit être comptée, et le logiciel embarqué ne doit employer pour le diagnostic aucun composant qui alloue de la mémoire dynamiquement."
source = "SYS-REQ-018, SYS-REQ-034 ; mesure CTRL-015 ; ADR 0005 ; #42"
status = "draft"

[[requirement]]
id = "SW-REQ-020"
title = "Numéro de démarrage persistant"
text = "Chaque processeur doit incrémenter un compteur de démarrage persistant et l'écrire durablement avant tout événement du démarrage ; les flux d'audit doivent être identifiés par le numéro de série de la pompe, le producteur et ce numéro. Un compteur illisible ou corrompu doit mettre la pompe hors service."
source = "SYS-REQ-035, SW-REQ-010 ; mesure CTRL-030 ; ADR 0006"
status = "draft"

[[requirement]]
id = "SW-REQ-021"
title = "Identité des événements sur la liaison"
text = "L'identité d'un événement d'audit transmis entre les processeurs doit être son flux et sa séquence d'audit, indépendante du numéro de transport. Le récepteur ne doit acquitter un événement qu'après sa confirmation durable : écriture durable confirmée dans le journal pour la commande, ancrage durable confirmé pour le témoin ; un accusé de simple réception, s'il existe, ne doit jamais autoriser l'émetteur à libérer sa copie. L'émetteur doit conserver chaque événement jusqu'à cet acquittement et réémettre les événements non acquittés après chaque rétablissement du lien ou redémarrage du récepteur. Le récepteur doit ignorer un doublon de même contenu, refuser et signaler comme altération un contenu différent sous la même identité, et retenir les événements qui suivent un trou jusqu'à la réception de l'événement manquant. Un trou qui persiste après le rétablissement du lien doit être consigné comme frontière du flux et signalé, jamais ignoré."
source = "SYS-REQ-018, SYS-REQ-052, SYS-REQ-053 ; SW-REQ-008 ; mesure CTRL-030 ; ADR 0006 ; #46"
status = "draft"

[[requirement]]
id = "HW-REQ-001"
title = "Sécurité électrique"
text = "L'isolement et les courants de fuite doivent respecter les exigences de l'IEC 60601-1 applicables, vérifiées par des pré-essais (#76)."
source = "Mesure CTRL-020 (RISK-017) ; IEC 60601-1"
status = "draft"

[[requirement]]
id = "HW-REQ-002"
title = "Protection contre les liquides"
text = "Le boîtier doit atteindre l'indice de protection IPX4 et résister, sans dégradation de ses fonctions ni de ses marquages, aux produits de nettoyage et de désinfection listés dans les instructions."
source = "Mesure CTRL-021 (RISK-018) ; UN-17 ; IEC 60529"
status = "draft"

[[requirement]]
id = "HW-REQ-003"
title = "Batterie"
text = "La batterie doit être de chimie lithium fer phosphate (LiFePO4), en cellules conformes à l'IEC 62133-2, protégée par un circuit matériel contre la surcharge, la décharge profonde, la surintensité et la température excessive ; sa charge ne doit être autorisée que dans la plage de température de charge des cellules."
source = "Mesure CTRL-028 (RISK-022) ; ADR 0004 ; IEC 62133-2"
status = "draft"

[[requirement]]
id = "HW-REQ-004"
title = "Bloc secteur externe"
text = "La pompe doit être alimentée par un bloc secteur externe conforme à l'IEC 60601-1, assurant deux moyens de protection du patient (2 MOPP), et ne recevoir qu'une très basse tension continue ; aucun circuit de la pompe ne doit être relié au secteur."
source = "Mesure CTRL-020 (RISK-017) ; ADR 0004 ; IEC 60601-1"
status = "draft"
