# Vérifications des exigences. Champs :
#   id            VER-nnn
#   method        test | analysis | inspection | demonstration
#   level         unit | integration | system | bench | precompliance
#                 (niveaux de software_development_file/verification-strategy.md)
#   requirements  liste d'identifiants d'exigences vérifiées
#   status        planned | passed | failed ; une vérification prévue n'est pas un résultat
#   reference     test, protocole ou rapport : fichier du dépôt, chemin relatif à sa racine,
#                 suivi éventuellement d'une « #ancre » ; obligatoire pour passed et failed
# Chaque SYS-REQ et HW-REQ a au moins une vérification de niveau bench ou precompliance.
#
# [[verification]]
# id = "VER-001"
# method = "test"
# level = "unit"
# requirements = ["SW-REQ-001"]
# status = "planned"
# reference = "tests/…"

