# Vérifie la cohérence du registre de traçabilité du dossier de développement
# et génère la matrice de traçabilité.
name: Registre de traçabilité

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - name: Tests du vérificateur
        run: python3 -m unittest discover -s tools/tests -v
      - name: Vérification du registre
        run: python3 tools/check_registry.py
      # La matrice n'est générée que si le registre est cohérent. Elle est publiée dans le résumé
      # de l'exécution et comme artefact ; la preuve d'archive est le rapport de version (#77).
      - name: Matrice de traçabilité
        run: |
          python3 tools/traceability_matrix.py --revision "$GITHUB_SHA" -o traceability-matrix.md
          cat traceability-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: matrice-de-tracabilite
          path: traceability-matrix.md
          if-no-files-found: error
      # SBOM de la révision : contrôle que le générateur fonctionne ; la SBOM d'une version
      # publiée est produite par version.yml.
      - name: SBOM
        run: python3 tools/sbom.py --version "0.0.0+g${GITHUB_SHA::12}" -o sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
