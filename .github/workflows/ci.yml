# Intégration continue du logiciel : build et tests avec sanitizers, formatage,
# analyse statique et licences. La traçabilité est vérifiée par registry.yml.
# Chaque phase est un pas distinct ; le résumé de chaque tâche publie son résultat.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

env:
  CLANG_FORMAT_VERSION: "21.1.8"
  REUSE_VERSION: "6.2.0"

jobs:
  build:
    name: build (${{ matrix.compiler.name }}, ${{ matrix.variant.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-14, cxx: g++-14, packages: g++-14 }
          - { name: clang-18, cxx: clang++-18, packages: clang-18 clang-tools-18 }
        variant:
          - { name: debug, sanitizers: "" }
          - { name: asan-ubsan, sanitizers: "address,undefined" }
          - { name: tsan, sanitizers: "thread" }
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=0:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Outils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ${{ matrix.compiler.packages }}
          cmake --version | head -1
          ${{ matrix.compiler.cxx }} --version | head -1
      - name: Réglage du noyau pour ThreadSanitizer
        if: matrix.variant.name == 'tsan'
        # L'entropie ASLR par défaut d'Ubuntu 24.04 est incompatible avec TSan.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configuration
        id: configure
        run: >
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
          -DCLEPSYDRE_SANITIZERS=${{ matrix.variant.sanitizers }}
      - name: Compilation
        id: compile
        run: cmake --build build/ci --target clepsydre_compile
      - name: Édition de liens
        id: link
        run: cmake --build build/ci
      - name: Tests
        id: test
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error
      - name: Résumé
        if: always()
        run: |
          {
            echo "### build (${{ matrix.compiler.name }}, ${{ matrix.variant.name }})"
            echo "| Phase | Résultat |"
            echo "| --- | --- |"
            echo "| Configuration | ${{ steps.configure.outcome }} |"
            echo "| Compilation | ${{ steps.compile.outcome }} |"
            echo "| Édition de liens | ${{ steps.link.outcome }} |"
            echo "| Tests | ${{ steps.test.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Formatage
        run: |
          git ls-files '*.cpp' '*.cppm' '*.hpp' > sources.txt
          pipx run --spec "clang-format==${CLANG_FORMAT_VERSION}" clang-format --version
          xargs -a sources.txt pipx run --spec "clang-format==${CLANG_FORMAT_VERSION}" \
            clang-format --dry-run --Werror

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Outils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-18 clang-tools-18 clang-tidy-18
          clang-tidy-18 --version | head -2
      - name: Configuration
        run: >
          cmake -S . -B build/tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-18 -DCLEPSYDRE_CLANG_TIDY=ON
      - name: Analyse statique
        run: cmake --build build/tidy

  licences:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Conformité REUSE
        run: pipx run "reuse==${REUSE_VERSION}" lint
