# Produit la nomenclature logicielle (SBOM, CycloneDX) d'une version publiée, à la poussée
# de son étiquette vX.Y.Z. La SBOM est publiée comme artefact ; le processus de publication
# la joint à la version, avec le rapport de vérification (#77).
name: Version

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.14"

jobs:
  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dépendances épinglées
        run: python3 tools/check_pins.py
      - name: Registre
        run: python3 tools/check_registry.py
      - name: SBOM
        run: python3 tools/sbom.py --version "$GITHUB_REF_NAME" -o "clepsydre-${GITHUB_REF_NAME}.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.ref_name }}
          path: clepsydre-${{ github.ref_name }}.cdx.json
          if-no-files-found: error
